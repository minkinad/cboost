services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dailyboost
      POSTGRES_PASSWORD: dailyboost
      POSTGRES_USER: dailyboost
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dailyboost -d dailyboost']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - dailyboost_postgres_data:/var/lib/postgresql/data

volumes:
  dailyboost_postgres_data:
