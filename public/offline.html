<body>
  <main class="card"><span class="mark">D</span><h1>Вы офлайн</h1><p>DailyBoost не создаёт отдельную локальную копию привычек. Уже открытые действия сохраняются в контролируемую очередь и синхронизируются с PostgreSQL после восстановления соединения.</p><button onclick="location.reload()">Повторить подключение</button></main>
