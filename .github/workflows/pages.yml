name: DailyBoost CI

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://dailyboost:dailyboost@localhost:5432/dailyboost?schema=public
  NUXT_SESSION_PASSWORD: ci-session-password-at-least-thirty-two-characters-long

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dailyboost
          POSTGRES_PASSWORD: dailyboost
          POSTGRES_USER: dailyboost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dailyboost -d dailyboost"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
