name: DailyBoost CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://dailyboost:dailyboost@localhost:5432/dailyboost?schema=public
  NUXT_SESSION_PASSWORD: ci-session-password-at-least-thirty-two-characters-long
  APP_ORIGIN: http://127.0.0.1:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dailyboost
          POSTGRES_PASSWORD: dailyboost
          POSTGRES_USER: dailyboost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dailyboost -d dailyboost"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e
